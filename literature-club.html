<!-- =====================================================
     LITERATURE CLUB GAME — SHAPE CHARACTER VERSION

     Required background images:
     corridor.jpg
     Club.jpeg

     Character portraits are now CSS shapes.
===================================================== -->

<div id="lc-game">

<style>
/* =====================================================
   GAME CONTAINER
===================================================== */

#lc-game {
    position: relative;
    width: 100%;
    max-width: 1200px;
    height: 700px;
    margin: 20px auto;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
}

/* =====================================================
   BACKGROUND
===================================================== */

#lc-background {
    position: absolute;
    inset: 0;
    background-image: url("corridor.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: filter .2s ease, background-image .7s ease;
}

/* =====================================================
   NAME SCREEN
===================================================== */

#lc-name-screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
        rgba(255,190,220,.94),
        rgba(255,225,238,.98)
    );
}

#lc-name-box {
    width: min(520px, 90%);
    padding: 40px;
    text-align: center;
    background: rgba(255,255,255,.98);
    color: #333;
    border-radius: 16px;
    box-shadow: 0 15px 50px rgba(100,30,70,.35);
}

#lc-name-box h1 {
    margin: 0 0 15px;
    color: #d94f8b;
    font-size: 32px;
}

#lc-name-box p {
    font-size: 17px;
    line-height: 1.5;
}

#lc-name-input {
    box-sizing: border-box;
    width: 100%;
    padding: 13px;
    margin: 12px 0 18px;
    border: 2px solid #ff9fc5;
    border-radius: 8px;
    outline: none;
    font-size: 18px;
}

#lc-name-input:focus {
    border-color: #d94f8b;
}

#lc-start-button {
    padding: 13px 30px;
    border: none;
    border-radius: 8px;
    background: #e75a98;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

#lc-start-button:hover {
    background: #c9407d;
}

/* =====================================================
   CSS SHAPE CHARACTERS
   No character image files are required.
===================================================== */

.lc-character {
    position: absolute;
    bottom: 135px;
    width: 300px;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    z-index: 5;
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
}

.lc-character.hidden {
    opacity: 0;
    transform: translateY(35px) scale(.96);
}

/* Main character silhouette */

.lc-shape {
    --character-color: #ff8db5;

    position: relative;
    width: 155px;
    height: 290px;
    margin-bottom: 0;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.35));
    transition: transform .3s ease, filter .3s ease;
}

/* Head */

.lc-shape::before {
    content: "";
    position: absolute;
    z-index: 2;
    width: 100px;
    height: 105px;
    left: 27px;
    top: 5px;
    background: var(--character-color);
    border: 4px solid rgba(255,255,255,.75);
    border-radius: 48% 48% 43% 43%;
    box-sizing: border-box;
}

/* Body */

.lc-shape::after {
    content: "";
    position: absolute;
    z-index: 1;
    width: 145px;
    height: 165px;
    left: 5px;
    top: 115px;
    background: var(--character-color);
    border: 4px solid rgba(255,255,255,.75);
    border-radius: 45% 45% 18% 18%;
    box-sizing: border-box;
}

/* Geometric decorations */

.lc-shape-decoration {
    position: absolute;
    z-index: 4;
    pointer-events: none;
}

/* SAYORI — coral pink circle and diamond */

#lc-sayori {
    left: 4%;
}

#lc-sayori .lc-shape {
    --character-color: #ff819f;
}

#lc-sayori .lc-shape::before {
    border-radius: 50%;
}

#lc-sayori .lc-shape::after {
    border-radius: 42% 42% 12% 12%;
}

/* NATSUKI — vivid pink rounded geometric silhouette */

#lc-natsuki {
    left: 27%;
}

#lc-natsuki .lc-shape {
    --character-color: #ff4fa3;
    transform: scale(.83);
    transform-origin: bottom center;
}

#lc-natsuki .lc-shape::before {
    width: 85px;
    height: 85px;
    left: 35px;
    border-radius: 28%;
    transform: rotate(5deg);
}

#lc-natsuki .lc-shape::after {
    border-radius: 28px 28px 8px 8px;
}

/* YURI — deep violet diamond-inspired silhouette */

#lc-yuri {
    right: 27%;
}

#lc-yuri .lc-shape {
    --character-color: #a78bfa;
    transform: scale(1.03);
    transform-origin: bottom center;
}

#lc-yuri .lc-shape::before {
    width: 94px;
    height: 110px;
    left: 30px;
    border-radius: 40% 40% 48% 48%;
}

#lc-yuri .lc-shape::after {
    width: 130px;
    left: 12px;
    border-radius: 50% 50% 10% 10%;
}

/* MONIKA — mint green polygon-inspired silhouette */

#lc-monika {
    right: 4%;
}

#lc-monika .lc-shape {
    --character-color: #65dfb5;
}

#lc-monika .lc-shape::before {
    border-radius: 45% 45% 38% 38%;
}

#lc-monika .lc-shape::after {
    border-radius: 38% 38% 4% 4%;
}

/* Shape face details */

.lc-face {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 43px;
    width: 44px;
    height: 12px;
    transform: translateX(-50%);
    display: flex;
    justify-content: space-between;
}

.lc-eye {
    display: block;
    width: 8px;
    height: 11px;
    background: #492a50;
    border-radius: 50%;
}

.lc-mouth {
    position: absolute;
    z-index: 5;
    top: 77px;
    left: 50%;
    width: 15px;
    height: 7px;
    transform: translateX(-50%);
    border-bottom: 3px solid #492a50;
    border-radius: 50%;
}

/* Decorative diamond above each character */

.lc-gem {
    position: absolute;
    z-index: 6;
    top: -9px;
    left: 50%;
    width: 20px;
    height: 20px;
    transform: translateX(-50%) rotate(45deg);
    background: rgba(255,255,255,.9);
    border: 2px solid var(--character-color);
    box-sizing: border-box;
}

/* =====================================================
   DIALOGUE
===================================================== */

#lc-dialogue {
    position: absolute;
    left: 3%;
    right: 3%;
    bottom: 18px;
    min-height: 135px;
    padding: 18px 24px;
    z-index: 20;
    background: rgba(20,20,28,.95);
    border: 3px solid #ffb6d3;
    border-radius: 14px;
    box-shadow: 0 0 30px rgba(100,30,70,.35);
    cursor: pointer;
    box-sizing: border-box;
}

#lc-speaker {
    margin-bottom: 8px;
    color: #ff9fc5;
    font-size: 21px;
    font-weight: bold;
}

#lc-text {
    font-size: 18px;
    line-height: 1.55;
}

#lc-indicator {
    position: absolute;
    right: 18px;
    bottom: 9px;
    color: #ff9fc5;
    animation: lc-blink 1s infinite;
}

@keyframes lc-blink {
    0%, 100% { opacity: .2; }
    50% { opacity: 1; }
}

/* =====================================================
   CHOICES
===================================================== */

#lc-choices {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(550px, 90%);
    z-index: 40;
    display: none;
}

.lc-choice {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 16px;
    border: none;
    border-radius: 9px;
    background: #e875a8;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(100,20,60,.25);
    transition: transform .15s, background .15s;
}

.lc-choice:hover {
    background: #cf4d87;
    transform: scale(1.03);
}

/* =====================================================
   POETRY
===================================================== */

#lc-poetry {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: none;
    padding: 30px;
    overflow-y: auto;
    box-sizing: border-box;
    background: linear-gradient(
        rgba(255,230,240,.98),
        rgba(255,213,230,.98)
    );
    color: #333;
    text-align: center;
}

#lc-poetry h1 {
    color: #c9417d;
}

#lc-poetry p {
    font-size: 17px;
}

#lc-poem-result {
    min-height: 40px;
    margin: 20px auto;
    max-width: 750px;
    color: #9f3568;
    font-size: 20px;
    font-style: italic;
}

#lc-word-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 800px;
    margin: 25px auto;
}

.lc-word {
    padding: 10px 16px;
    border: 2px solid #ff9fc5;
    border-radius: 8px;
    background: white;
    color: #743b55;
    cursor: pointer;
    font-size: 15px;
}

.lc-word:hover {
    background: #ffd3e4;
    transform: translateY(-2px);
}

#lc-finish-poem {
    display: none;
    padding: 13px 30px;
    border: none;
    border-radius: 8px;
    background: #d94f8b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* =====================================================
   ENDING
===================================================== */

#lc-ending {
    position: absolute;
    inset: 0;
    z-index: 90;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    box-sizing: border-box;
    background: #090909;
    color: #ffb6d3;
    text-align: center;
}

#lc-ending h1 {
    font-size: 46px;
    margin-bottom: 10px;
}

#lc-ending p {
    max-width: 650px;
    color: #ddd;
    font-size: 18px;
    line-height: 1.6;
}

#lc-restart {
    margin-top: 20px;
    padding: 13px 30px;
    border: none;
    border-radius: 8px;
    background: #e75a98;
    color: white;
    cursor: pointer;
}

/* =====================================================
   GLITCH
===================================================== */

.lc-glitch {
    animation: lc-glitch-animation .08s infinite;
}

@keyframes lc-glitch-animation {
    0% {
        transform: translate(0);
        filter: none;
    }

    20% {
        transform: translate(6px,-3px);
        filter: hue-rotate(90deg);
    }

    40% {
        transform: translate(-5px,3px);
        filter: contrast(1.5);
    }

    60% {
        transform: translate(3px,5px);
        filter: hue-rotate(-90deg);
    }

    80% {
        transform: translate(-4px,-2px);
        filter: invert(.08);
    }

    100% {
        transform: translate(0);
        filter: none;
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {
    #lc-game {
        height: 100vh;
        max-height: 700px;
        min-height: 550px;
        border-radius: 0;
        margin: 0;
    }

    .lc-character {
        width: 24%;
        height: 300px;
        bottom: 155px;
    }

    .lc-shape {
        transform: scale(.65);
        transform-origin: bottom center;
    }

    #lc-natsuki .lc-shape {
        transform: scale(.58);
    }

    #lc-yuri .lc-shape {
        transform: scale(.68);
    }

    #lc-sayori {
        left: 0;
    }

    #lc-natsuki {
        left: 23%;
    }

    #lc-yuri {
        right: 23%;
    }

    #lc-monika {
        right: 0;
    }

    #lc-dialogue {
        left: 2%;
        right: 2%;
        bottom: 10px;
        padding: 14px 16px 22px;
    }

    #lc-text {
        font-size: 15px;
    }

    #lc-speaker {
        font-size: 18px;
    }

    #lc-name-box {
        padding: 25px;
    }

    #lc-poetry {
        padding: 20px 12px;
    }

    #lc-ending h1 {
        font-size: 34px;
    }
}
</style>

<script>
(function () {
    "use strict";

    /* =====================================================
       STATE
    ===================================================== */

    let playerName = "";
    let sceneIndex = 0;
    let poemWords = [];
    let gameFinished = false;
    let glitchStarted = false;
    let advancingToGlitch = false;

    const affection = {
        sayori: 0,
        natsuki: 0,
        yuri: 0,
        monika: 0
    };

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const root = document.getElementById("lc-game");
    const nameScreen = document.getElementById("lc-name-screen");
    const nameInput = document.getElementById("lc-name-input");
    const startButton = document.getElementById("lc-start-button");
    const background = document.getElementById("lc-background");
    const dialogue = document.getElementById("lc-dialogue");
    const speaker = document.getElementById("lc-speaker");
    const text = document.getElementById("lc-text");
    const choices = document.getElementById("lc-choices");
    const poetry = document.getElementById("lc-poetry");
    const poemResult = document.getElementById("lc-poem-result");
    const finishPoem = document.getElementById("lc-finish-poem");
    const ending = document.getElementById("lc-ending");
    const endingTitle = document.getElementById("lc-ending-title");
    const endingText = document.getElementById("lc-ending-text");

    const characters = {
        sayori: document.getElementById("lc-sayori"),
        natsuki: document.getElementById("lc-natsuki"),
        yuri: document.getElementById("lc-yuri"),
        monika: document.getElementById("lc-monika")
    };

    /* =====================================================
       BACKGROUND
    ===================================================== */

    function setBackground(image) {
        background.style.backgroundImage =
            'url("' + image + '")';
    }

    /* =====================================================
       CHARACTERS
    ===================================================== */

    function showCharacter(character) {
        Object.values(characters).forEach(function (element) {
            element.classList.add("hidden");
        });

        if (character && characters[character]) {
            characters[character].classList.remove("hidden");
        }
    }

    /* =====================================================
       TEXT
    ===================================================== */

    function processText(value) {
        return value.replace(/\{\{name\}\}/g, playerName);
    }

    /* =====================================================
       STORY
    ===================================================== */

    const scenes = [
        {
            speaker: "Narrator",
            character: null,
            background: "corridor.jpg",
            text: "The final bell rings. You walk through the quiet school corridor when you notice a handwritten sign taped to a classroom door."
        },
        {
            speaker: "Narrator",
            character: null,
            background: "corridor.jpg",
            text: "LITERATURE CLUB — NEW MEMBERS WELCOME."
        },
        {
            speaker: "Sayori",
            character: "sayori",
            background: "Club.jpeg",
            text: "There you are! I was starting to wonder if you'd actually come, {{name}}!"
        },
        {
            speaker: "Sayori",
            character: "sayori",
            background: "Club.jpeg",
            text: "Come on! Everyone's waiting inside."
        },
        {
            speaker: "Narrator",
            character: null,
            background: "Club.jpeg",
            text: "You step into the Literature Club."
        },
        {
            speaker: "Natsuki",
            character: "natsuki",
            background: "Club.jpeg",
            text: "Hmph. So you're the new member."
        },
        {
            speaker: "Natsuki",
            character: "natsuki",
            background: "Club.jpeg",
            text: "Don't expect me to make some huge welcome speech."
        },
        {
            speaker: "Yuri",
            character: "yuri",
            background: "Club.jpeg",
            text: "Natsuki... you could at least try to be welcoming."
        },
        {
            speaker: "Yuri",
            character: "yuri",
            background: "Club.jpeg",
            text: "It's nice to meet you, {{name}}."
        },
        {
            speaker: "Monika",
            character: "monika",
            background: "Club.jpeg",
            text: "And I'm Monika, the club president."
        },
        {
            speaker: "Monika",
            character: "monika",
            background: "Club.jpeg",
            text: "I'm glad you decided to give us a chance."
        },
        {
            speaker: "Sayori",
            character: "sayori",
            background: "Club.jpeg",
            text: "Today we're going to do something really simple."
        },
        {
            speaker: "Sayori",
            character: "sayori",
            background: "Club.jpeg",
            text: "We're all going to write a poem!"
        },
        {
            speaker: "Natsuki",
            character: "natsuki",
            background: "Club.jpeg",
            text: "Finally. Something fun."
        },
        {
            speaker: "Yuri",
            character: "yuri",
            background: "Club.jpeg",
            text: "I think writing can reveal quite a lot about someone."
        },
        {
            speaker: "Monika",
            character: "monika",
            background: "Club.jpeg",
            text: "Exactly."
        },
        {
            speaker: "Monika",
            character: "monika",
            background: "Club.jpeg",
            text: "So, {{name}}, whose advice would you like first?"
        }
    ];

    /* =====================================================
       SHOW SCENE
    ===================================================== */

    function showScene() {
        if (sceneIndex >= scenes.length) {
            showMainChoice();
            return;
        }

        const scene = scenes[sceneIndex];

        setBackground(scene.background);
        showCharacter(scene.character);

        speaker.textContent = scene.speaker;
        text.textContent = processText(scene.text);
    }

    /* =====================================================
       DIALOGUE CLICK
    ===================================================== */

    dialogue.addEventListener("click", function () {
        if (gameFinished || advancingToGlitch) {
            return;
        }

        sceneIndex++;
        showScene();
    });

    /* =====================================================
       CHARACTER CHOICE
    ===================================================== */

    function showMainChoice() {
        dialogue.style.display = "none";
        choices.style.display = "block";
        choices.innerHTML = "";

        const options = [
            { name: "Sayori", key: "sayori" },
            { name: "Natsuki", key: "natsuki" },
            { name: "Yuri", key: "yuri" },
            { name: "Monika", key: "monika" }
        ];

        options.forEach(function (option) {
            const button = document.createElement("button");

            button.className = "lc-choice";
            button.textContent = "Ask " + option.name + " for advice.";

            button.addEventListener("click", function () {
                affection[option.key]++;

                choices.style.display = "none";
                openPoetry();
            });

            choices.appendChild(button);
        });
    }

    /* =====================================================
       POETRY
    ===================================================== */

    function openPoetry() {
        poemWords = [];

        poemResult.textContent = "Your poem is empty...";
        finishPoem.style.display = "none";
        poetry.style.display = "block";

        root.querySelectorAll(".lc-word").forEach(function (word) {
            word.disabled = false;
        });
    }

    /* =====================================================
       WORD SELECTION
    ===================================================== */

    root.querySelectorAll(".lc-word").forEach(function (word) {
        word.addEventListener("click", function () {
            if (poemWords.length >= 10) {
                return;
            }

            poemWords.push(word.textContent);

            poemResult.textContent = poemWords.join(" • ");

            if (poemWords.length >= 5) {
                finishPoem.style.display = "inline-block";
            }

            if (poemWords.length >= 10) {
                root.querySelectorAll(".lc-word").forEach(function (item) {
                    item.disabled = true;
                });
            }
        });
    });

    /* =====================================================
       DETERMINE POEM CHARACTER
    ===================================================== */

    function determinePoemCharacter() {
        const words = poemWords.join(" ").toLowerCase();

        const scores = {
            sayori: affection.sayori,
            natsuki: affection.natsuki,
            yuri: affection.yuri,
            monika: affection.monika
        };

        if (
            words.includes("sunshine") ||
            words.includes("smile") ||
            words.includes("friend") ||
            words.includes("hope")
        ) {
            scores.sayori += 2;
        }

        if (
            words.includes("heart") ||
            words.includes("warmth")
        ) {
            scores.natsuki += 2;
        }

        if (
            words.includes("night") ||
            words.includes("silence") ||
            words.includes("ocean") ||
            words.includes("lonely")
        ) {
            scores.yuri += 2;
        }

        if (
            words.includes("secret") ||
            words.includes("forever") ||
            words.includes("dream")
        ) {
            scores.monika += 2;
        }

        let winner = "sayori";

        Object.keys(scores).forEach(function (key) {
            if (scores[key] > scores[winner]) {
                winner = key;
            }
        });

        return winner;
    }

    /* =====================================================
       POEM REACTION
    ===================================================== */

    function poemReaction(character) {
        if (character === "sayori") {
            return "Sayori reads your poem carefully. \"It's really sweet, " +
                playerName +
                ". I think I understand what you were trying to say.\"";
        }

        if (character === "natsuki") {
            return "Natsuki looks over your poem. \"Not bad. Don't let that go to your head, though.\"";
        }

        if (character === "yuri") {
            return "Yuri studies the page quietly. \"There is something strangely personal about this...\"";
        }

        return "Monika smiles as she reads your poem. \"Interesting choices, " +
            playerName +
            ". Very interesting.\"";
    }

    /* =====================================================
       FINISH POEM
    ===================================================== */

    finishPoem.addEventListener("click", function () {
        if (poemWords.length < 5) {
            return;
        }

        poetry.style.display = "none";
        dialogue.style.display = "block";

        const character = determinePoemCharacter();

        showCharacter(character);

        speaker.textContent =
            character.charAt(0).toUpperCase() + character.slice(1);

        text.textContent = poemReaction(character);

        advancingToGlitch = true;

        dialogue.onclick = function () {
            dialogue.onclick = null;
            beginGlitch();
        };
    });

    /* =====================================================
       GLITCH
    ===================================================== */

    function beginGlitch() {
        if (glitchStarted || gameFinished) {
            return;
        }

        glitchStarted = true;
        advancingToGlitch = false;

        background.classList.add("lc-glitch");

        speaker.textContent = "???";
        text.textContent = playerName + "...";

        showCharacter(null);

        window.setTimeout(function () {
            if (gameFinished) return;
            text.textContent = "Can you hear me?";
        }, 1200);

        window.setTimeout(function () {
            if (gameFinished) return;
            text.textContent = "Something is wrong with this room.";
        }, 2600);

        window.setTimeout(function () {
            if (gameFinished) return;

            background.classList.remove("lc-glitch");
            setBackground("Club.jpeg");

            showCharacter("monika");

            speaker.textContent = "Monika";
            text.textContent = "Don't worry.";
        }, 4200);

        window.setTimeout(function () {
            if (gameFinished) return;
            text.textContent = "I think I can fix it.";
        }, 5600);

        window.setTimeout(function () {
            if (gameFinished) return;
            showFinalChoice();
        }, 7000);
    }

    /* =====================================================
       FINAL CHOICE
    ===================================================== */

    function showFinalChoice() {
        dialogue.style.display = "none";
        choices.style.display = "block";
        choices.innerHTML = "";

        const stay = document.createElement("button");

        stay.className = "lc-choice";
        stay.textContent = "Stay and help Monika.";

        stay.addEventListener("click", function () {
            choices.style.display = "none";
            goodEnding();
        });

        choices.appendChild(stay);

        const leave = document.createElement("button");

        leave.className = "lc-choice";
        leave.textContent = "Leave the classroom.";

        leave.addEventListener("click", function () {
            choices.style.display = "none";
            escapeEnding();
        });

        choices.appendChild(leave);
    }

    /* =====================================================
       ENDINGS
    ===================================================== */

    function goodEnding() {
        gameFinished = true;

        ending.style.display = "flex";
        endingTitle.textContent = "The Club Remains";

        endingText.textContent =
            "You stay. The strange distortion fades, " +
            "and the classroom slowly returns to normal. " +
            "Whatever happened tonight, the Literature Club " +
            "is still here — and so are you.";
    }

    function escapeEnding() {
        gameFinished = true;

        ending.style.display = "flex";
        endingTitle.textContent = "Outside";

        endingText.textContent =
            "You leave the classroom and walk home. " +
            "The next morning, however, you find a small note " +
            "inside your school locker. It contains only one word: " +
            playerName +
            ".";
    }

    /* =====================================================
       START
    ===================================================== */

    function startGame() {
        const name = nameInput.value.trim();

        if (name.length === 0) {
            nameInput.value = "";
            nameInput.placeholder = "Please enter your name...";
            nameInput.focus();
            return;
        }

        playerName = name.substring(0, 20);

        nameScreen.style.display = "none";

        sceneIndex = 0;
        gameFinished = false;
        glitchStarted = false;
        advancingToGlitch = false;

        Object.keys(affection).forEach(function (key) {
            affection[key] = 0;
        });

        choices.style.display = "none";
        poetry.style.display = "none";
        ending.style.display = "none";
        dialogue.style.display = "block";
        background.classList.remove("lc-glitch");

        setBackground("corridor.jpg");
        showScene();
    }

    startButton.addEventListener("click", startGame);

    nameInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            startGame();
        }
    });

    /* =====================================================
       RESTART
    ===================================================== */

    document.getElementById("lc-restart").addEventListener("click", function () {
        playerName = "";
        sceneIndex = 0;
        poemWords = [];
        gameFinished = false;
        glitchStarted = false;
        advancingToGlitch = false;

        Object.keys(affection).forEach(function (key) {
            affection[key] = 0;
        });

        nameInput.value = "";
        nameInput.placeholder = "Enter your name...";

        choices.innerHTML = "";
        choices.style.display = "none";
        poetry.style.display = "none";
        ending.style.display = "none";
        dialogue.style.display = "block";
        background.classList.remove("lc-glitch");

        setBackground("corridor.jpg");
        showCharacter(null);

        nameScreen.style.display = "flex";
        nameInput.focus();
    });

    /* =====================================================
       INITIALIZATION
    ===================================================== */

    setBackground("corridor.jpg");
    showCharacter(null);
})();
</script>
