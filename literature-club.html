<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Literature Club</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}


/* =========================================================
   GAME
========================================================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #f6cddd;
}


/* =========================================================
   BACKGROUND
========================================================= */

#background {

    position: absolute;

    inset: 0;

    background-image: url("corridor.jpg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transition:
        background-image .8s,
        filter .2s;
}


/* =========================================================
   NAME SCREEN
========================================================= */

#nameScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            rgba(255,190,220,.92),
            rgba(255,225,238,.97)
        );
}

.nameBox {

    width: min(520px, 90vw);

    padding: 42px;

    text-align: center;

    background: rgba(255,255,255,.96);

    border-radius: 16px;

    box-shadow:
        0 15px 50px rgba(100,30,70,.3);
}

.nameBox h1 {

    margin-top: 0;

    color: #d94f8b;

    font-size: 32px;
}

.nameBox p {

    color: #555;

    font-size: 18px;
}

#nameInput {

    width: 100%;

    padding: 14px;

    margin: 15px 0;

    border: 2px solid #ff9fc5;

    border-radius: 8px;

    outline: none;

    font-size: 18px;
}

#nameInput:focus {

    border-color: #d94f8b;
}

#nameButton {

    padding: 13px 30px;

    border: none;

    border-radius: 8px;

    background: #e75a98;

    color: white;

    font-size: 17px;

    cursor: pointer;
}

#nameButton:hover {

    background: #c9407d;
}


/* =========================================================
   CHARACTERS
========================================================= */

.character {

    position: absolute;

    bottom: 135px;

    width: 300px;
    height: 500px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    opacity: 1;

    transition:
        opacity .4s,
        transform .4s;

    pointer-events: none;

    z-index: 5;
}

.character.hidden {

    opacity: 0;

    transform:
        translateY(35px)
        scale(.96);
}

.character img {

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            0 8px 12px
            rgba(0,0,0,.3)
        );
}


/* Character positions */

#sayori {

    left: 6%;
}

#natsuki {

    left: 27%;
}

#yuri {

    right: 27%;
}

#monika {

    right: 6%;
}


/* =========================================================
   DIALOGUE BOX
========================================================= */

#dialogue {

    position: absolute;

    left: 4%;
    right: 4%;

    bottom: 18px;

    min-height: 135px;

    padding: 18px 24px;

    background:
        rgba(20,20,28,.94);

    border:
        3px solid #ffb6d3;

    border-radius: 14px;

    color: white;

    box-shadow:
        0 0 30px
        rgba(100,30,70,.35);

    cursor: pointer;

    z-index: 10;
}

#speaker {

    margin-bottom: 8px;

    color: #ff9fc5;

    font-size: 21px;

    font-weight: bold;
}

#text {

    font-size: 18px;

    line-height: 1.55;
}

#continueIndicator {

    position: absolute;

    right: 18px;

    bottom: 10px;

    color: #ff9fc5;

    animation: blink 1s infinite;
}

@keyframes blink {

    0%, 100% {
        opacity: .2;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   CHOICES
========================================================= */

#choices {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width:
        min(550px, 90vw);

    z-index: 30;

    display: none;
}

.choice {

    display: block;

    width: 100%;

    margin: 10px 0;

    padding: 16px;

    border: none;

    border-radius: 9px;

    background: #e875a8;

    color: white;

    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(100,20,60,.2);

    transition:
        transform .15s,
        background .15s;
}

.choice:hover {

    background: #cf4d87;

    transform: scale(1.03);
}


/* =========================================================
   POETRY
========================================================= */

#poetry {

    position: absolute;

    inset: 0;

    z-index: 40;

    display: none;

    padding: 35px;

    overflow-y: auto;

    background:
        linear-gradient(
            rgba(255,230,240,.97),
            rgba(255,213,230,.97)
        );

    text-align: center;
}

#poetry h1 {

    margin-top: 5px;

    color: #c9417d;
}

#poetry p {

    color: #555;

    font-size: 17px;
}

#poemResult {

    min-height: 40px;

    margin: 20px auto;

    max-width: 750px;

    color: #9f3568;

    font-size: 20px;

    font-style: italic;
}

.words {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;

    max-width: 750px;

    margin: 25px auto;
}

.word {

    padding: 10px 16px;

    background: white;

    border:
        2px solid #ff9fc5;

    border-radius: 8px;

    color: #743b55;

    cursor: pointer;

    transition: .15s;
}

.word:hover {

    background: #ffd3e4;

    transform:
        translateY(-3px);
}

#continuePoem {

    display: none;

    padding: 13px 30px;

    border: none;

    border-radius: 8px;

    background: #d94f8b;

    color: white;

    font-size: 16px;

    cursor: pointer;
}


/* =========================================================
   ENDING
========================================================= */

#ending {

    position: absolute;

    inset: 0;

    z-index: 90;

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #090909;

    color: #ffb6d3;

    text-align: center;
}

#ending h1 {

    font-size: 46px;

    margin-bottom: 10px;
}

#ending p {

    max-width: 600px;

    color: #ddd;

    font-size: 18px;

    line-height: 1.6;
}

#restart {

    margin-top: 20px;

    padding: 13px 30px;

    border: none;

    border-radius: 8px;

    background: #e75a98;

    color: white;

    cursor: pointer;
}


/* =========================================================
   GLITCH
========================================================= */

.glitch {

    animation:
        glitch .08s infinite;
}

@keyframes glitch {

    0% {

        transform:
            translate(0);

        filter: none;
    }

    20% {

        transform:
            translate(6px,-3px);

        filter:
            hue-rotate(90deg);
    }

    40% {

        transform:
            translate(-5px,3px);

        filter:
            contrast(1.5);
    }

    60% {

        transform:
            translate(3px,5px);

        filter:
            hue-rotate(-90deg);
    }

    80% {

        transform:
            translate(-4px,-2px);

        filter:
            invert(.08);
    }

    100% {

        transform:
            translate(0);

        filter: none;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .character {

        width: 180px;

        height: 320px;

        bottom: 145px;
    }

    #sayori {
        left: 0;
    }

    #natsuki {
        left: 18%;
    }

    #yuri {
        right: 18%;
    }

    #monika {
        right: 0;
    }

    #text {

        font-size: 16px;
    }

    #speaker {

        font-size: 18px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAME ENTRY SCREEN
===================================================== -->

<div id="nameScreen">

    <div class="nameBox">

        <h1>Literature Club</h1>

        <p>
            Welcome.
        </p>

        <p>
            Before we begin, what should everyone call you?
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            placeholder="Enter your name..."
            autocomplete="off"
        >

        <br>

        <button id="nameButton">
            Enter the Club
        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game">


    <!-- BACKGROUND -->

    <div id="background"></div>


    <!-- =================================================
         SAYORI
    ================================================= -->

    <div
        id="sayori"
        class="character hidden"
    >

        <img
            src="Sayori.jpeg"
            alt="Sayori"
        >

    </div>


    <!-- =================================================
         NATSUKI
    ================================================= -->

    <div
        id="natsuki"
        class="character hidden"
    >

        <img
            src="Natsuki.jpg"
            alt="Natsuki"
        >

    </div>


    <!-- =================================================
         YURI
    ================================================= -->

    <div
        id="yuri"
        class="character hidden"
    >

        <img
            src="Yuri.jpeg"
            alt="Yuri"
        >

    </div>


    <!-- =================================================
         MONIKA
    ================================================= -->

    <div
        id="monika"
        class="character hidden"
    >

        <img
            src="Monica.jpeg"
            alt="Monika"
        >

    </div>


    <!-- =================================================
         DIALOGUE
    ================================================= -->

    <div id="dialogue">

        <div id="speaker">
            Narrator
        </div>

        <div id="text">
            ...
        </div>

        <div id="continueIndicator">
            ▼
        </div>

    </div>


    <!-- =================================================
         CHOICES
    ================================================= -->

    <div id="choices"></div>


    <!-- =================================================
         POETRY
    ================================================= -->

    <div id="poetry">

        <h1>
            Write a Poem
        </h1>

        <p>
            Choose at least five words.
            Your choices may influence what happens next.
        </p>

        <div id="poemResult">
            Your poem is empty...
        </div>

        <div class="words">

            <button class="word">
                Dream
            </button>

            <button class="word">
                Love
            </button>

            <button class="word">
                Sunshine
            </button>

            <button class="word">
                Smile
            </button>

            <button class="word">
                Memory
            </button>

            <button class="word">
                Hope
            </button>

            <button class="word">
                Rain
            </button>

            <button class="word">
                Lonely
            </button>

            <button class="word">
                Heart
            </button>

            <button class="word">
                Secret
            </button>

            <button class="word">
                Fear
            </button>

            <button class="word">
                Star
            </button>

            <button class="word">
                Home
            </button>

            <button class="word">
                Forever
            </button>

            <button class="word">
                Silence
            </button>

            <button class="word">
                Ocean
            </button>

            <button class="word">
                Friend
            </button>

            <button class="word">
                Night
            </button>

            <button class="word">
                Warmth
            </button>

            <button class="word">
                Broken
            </button>

        </div>

        <button id="continuePoem">
            Finish Poem
        </button>

    </div>


    <!-- =================================================
         ENDING
    ================================================= -->

    <div id="ending">

        <h1 id="endingTitle">
            The End
        </h1>

        <p id="endingText">
            ...
        </p>

        <button id="restart">
            Start Again
        </button>

    </div>


</div>


<script>

/* =========================================================
   GAME VARIABLES
========================================================= */

let playerName = "";

let sceneIndex = 0;

let poemWords = [];

let postPoemStarted = false;

let gameFinished = false;


/* =========================================================
   AFFECTION
========================================================= */

let affection = {

    sayori: 0,

    natsuki: 0,

    yuri: 0,

    monika: 0

};


/* =========================================================
   ELEMENTS
========================================================= */

const nameScreen =
    document.getElementById(
        "nameScreen"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const nameButton =
    document.getElementById(
        "nameButton"
    );

const dialogue =
    document.getElementById(
        "dialogue"
    );

const speaker =
    document.getElementById(
        "speaker"
    );

const text =
    document.getElementById(
        "text"
    );

const choices =
    document.getElementById(
        "choices"
    );

const poetry =
    document.getElementById(
        "poetry"
    );

const poemResult =
    document.getElementById(
        "poemResult"
    );

const continuePoem =
    document.getElementById(
        "continuePoem"
    );

const background =
    document.getElementById(
        "background"
    );

const ending =
    document.getElementById(
        "ending"
    );

const endingTitle =
    document.getElementById(
        "endingTitle"
    );

const endingText =
    document.getElementById(
        "endingText"
    );


/* =========================================================
   CHARACTERS
========================================================= */

const characters = {

    sayori:
        document.getElementById(
            "sayori"
        ),

    natsuki:
        document.getElementById(
            "natsuki"
        ),

    yuri:
        document.getElementById(
            "yuri"
        ),

    monika:
        document.getElementById(
            "monika"
        )

};


/* =========================================================
   BACKGROUND CONTROL
========================================================= */

function setBackground(image) {

    background.style.backgroundImage =
        `url("${image}")`;

}


/* =========================================================
   SHOW CHARACTER
========================================================= */

function showCharacter(name) {

    Object.values(characters)
        .forEach(character => {

            character.classList.add(
                "hidden"
            );

        });


    if (
        name &&
        characters[name]
    ) {

        characters[name]
            .classList.remove(
                "hidden"
            );

    }

}


/* =========================================================
   STORY SCENES
========================================================= */

const scenes = [

    {
        speaker: "Narrator",

        character: null,

        location: "corridor",

        text:
        "The final bell rings. You walk through the quiet school corridor when you notice a handwritten sign taped to a classroom door."
    },


    {
        speaker: "Narrator",

        character: null,

        location: "corridor",

        text:
        "LITERATURE CLUB — NEW MEMBERS WELCOME."
    },


    {
        speaker: "Sayori",

        character: "sayori",

        location: "classroom",

        text:
        "There you are! I was starting to wonder if you'd actually come, {{name}}!"
    },


    {
        speaker: "Sayori",

        character: "sayori",

        location: "classroom",

        text:
        "Come on! Everyone's waiting inside."
    },


    {
        speaker: "Narrator",

        character: null,

        location: "classroom",

        text:
        "You step through the classroom door."
    },


    {
        speaker: "Natsuki",

        character: "natsuki",

        location: "classroom",

        text:
        "Hmph. So you're the new member."
    },


    {
        speaker: "Natsuki",

        character: "natsuki",

        location: "classroom",

        text:
        "Don't expect me to make some huge welcome speech."
    },


    {
        speaker: "Yuri",

        character: "yuri",

        location: "classroom",

        text:
        "Natsuki... you could at least try to be welcoming."
    },


    {
        speaker: "Yuri",

        character: "yuri",

        location: "classroom",

        text:
        "It's nice to meet you, {{name}}."
    },


    {
        speaker: "Monika",

        character: "monika",

        location: "classroom",

        text:
        "And I'm Monika, the club president."
    },


    {
        speaker: "Monika",

        character: "monika",

        location: "classroom",

        text:
        "I'm glad you decided to give us a chance."
    },


    {
        speaker: "Sayori",

        character: "sayori",

        location: "classroom",

        text:
        "Today we're going to do something really simple."
    },


    {
        speaker: "Sayori",

        character: "sayori",

        location: "classroom",

        text:
        "We're all going to write a poem!"
    },


    {
        speaker: "Natsuki",

        character: "natsuki",

        location: "classroom",

        text:
        "Finally. Something fun."
    },


    {
        speaker: "Yuri",

        character: "yuri",

        location: "classroom",

        text:
        "I think writing can reveal quite a lot about someone."
    },


    {
        speaker: "Monika",

        character: "monika",

        location: "classroom",

        text:
        "Exactly."
    },


    {
        speaker: "Monika",

        character: "monika",

        location: "classroom",

        text:
        "So, {{name}}, whose advice would you like first?"
    }

];


/* =========================================================
   TEXT PROCESSING
========================================================= */

function processText(value) {

    return value.replace(
        /\{\{name\}\}/g,
        playerName
    );

}


/* =========================================================
   SHOW SCENE
========================================================= */

function showScene() {

    if (
        sceneIndex >= scenes.length
    ) {

        showMainChoice();

        return;

    }


    const scene =
        scenes[sceneIndex];


    /* Background */

    if (
        scene.location ===
        "corridor"
    ) {

        setBackground(
            "corridor.jpg"
        );

    } else {

        setBackground(
            "Club.jpeg"
        );

    }


    /* Character */

    showCharacter(
        scene.character
    );


    /* Dialogue */

    speaker.textContent =
        scene.speaker;

    text.textContent =
        processText(
            scene.text
        );

}


/* =========================================================
   DIALOGUE CLICK
========================================================= */

dialogue.addEventListener(
    "click",
    () => {

        if (
            gameFinished
        ) {
            return;
        }


        if (
            poetry.style.display ===
            "block"
        ) {
            return;
        }


        if (
            choices.style.display ===
            "block"
        ) {
            return;
        }


        if (
            sceneIndex <
            scenes.length
        ) {

            sceneIndex++;

            showScene();

            return;

        }


        if (
            postPoemStarted === false
        ) {

            postPoemStarted = true;

            triggerStoryEvent();

        }

    }
);


/* =========================================================
   MAIN CHARACTER CHOICE
========================================================= */

function showMainChoice() {

    dialogue.style.display =
        "none";

    choices.style.display =
        "block";

    choices.innerHTML = "";


    const options = [

        {
            text:
                "Ask Sayori for advice.",

            character:
                "sayori"
        },

        {
            text:
                "Ask Natsuki for advice.",

            character:
                "natsuki"
        },

        {
            text:
                "Ask Yuri for advice.",

            character:
                "yuri"
        },

        {
            text:
                "Ask Monika for advice.",

            character:
                "monika"
        }

    ];


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "choice";


            button.textContent =
                option.text;


            button.onclick = () => {

                affection[
                    option.character
                ]++;


                choices.style.display =
                    "none";


                openPoetry();

            };


            choices.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   POETRY
========================================================= */

function openPoetry() {

    poetry.style.display =
        "block";

    poemWords = [];

    poemResult.textContent =
        "Your poem is empty...";

    continuePoem.style.display =
        "none";

}


/* =========================================================
   WORD BUTTONS
========================================================= */

document
    .querySelectorAll(".word")
    .forEach(word => {

        word.addEventListener(
            "click",
            () => {

                if (
                    poemWords.length >=
                    10
                ) {
                    return;
                }


                poemWords.push(
                    word.textContent
                );


                poemResult.textContent =
                    poemWords.join(
                        " • "
                    );


                if (
                    poemWords.length >=
                    5
                ) {

                    continuePoem.style.display =
                        "inline-block";

                }

            }
        );

    });


/* =========================================================
   FINISH POEM
========================================================= */

continuePoem.onclick = () => {

    poetry.style.display =
        "none";

    dialogue.style.display =
        "block";


    const chosen =
        determinePoemCharacter();


    showCharacter(
        chosen
    );


    speaker.textContent =
        capitalize(
            chosen
        );


    text.textContent =
        getPoemReaction(
            chosen
        );

};


/* =========================================================
   DETERMINE POEM CHARACTER
========================================================= */

function determinePoemCharacter() {

    const wordText =
        poemWords
            .join(" ")
            .toLowerCase();


    let score = {

        sayori:
            affection.sayori,

        natsuki:
            affection.natsuki,

        yuri:
            affection.yuri,

        monika:
            affection.monika

    };


    /* Sayori words */

    if (
        wordText.includes(
            "sunshine"
        ) ||
        wordText.includes(
            "smile"
        ) ||
        wordText.includes(
            "friend"
        ) ||
        wordText.includes(
            "hope"
        )
    ) {

        score.sayori += 2;

    }


    /* Natsuki words */

    if (
        wordText.includes(
            "heart"
        ) ||
        wordText.includes(
            "warmth"
        ) ||
        wordText.includes(
            "smile"
        )
    ) {

        score.natsuki += 2;

    }


    /* Yuri words */

    if (
        wordText.includes(
            "night"
        ) ||
        wordText.includes(
            "silence"
        ) ||
        wordText.includes(
            "ocean"
        ) ||
        wordText.includes(
            "lonely"
        )
    ) {

        score.yuri += 2;

    }


    /* Monika words */

    if (
        wordText.includes(
            "secret"
        ) ||
        wordText.includes(
            "forever"
        ) ||
        wordText.includes(
            "dream"
        )
    ) {

        score.monika += 2;

    }


    let winner =
        "sayori";


    Object.keys(score)
        .forEach(name => {

            if (
                score[name] >
                score[winner]
            ) {

                winner =
                    name;

            }

        });


    return winner;

}


/* =========================================================
   POEM REACTIONS
========================================================= */

function getPoemReaction(
    character
) {

    if (
        character ===
        "sayori"
    ) {

        return (
            "Sayori reads your poem carefully. " +
            "\"It's really sweet, " +
            playerName +
            ". I think I understand what you were trying to say.\""
        );

    }


    if (
        character ===
        "natsuki"
    ) {

        return (
            "Natsuki looks over your poem. " +
            "\"Not bad. Don't let that go to your head, though.\""
        );

    }


    if (
        character ===
        "yuri"
    ) {

        return (
            "Yuri studies the page for a moment. " +
            "\"There is something strangely personal about this...\""
        );

    }


    return (
        "Monika smiles as she reads your poem. " +
        "\"Interesting choices, " +
        playerName +
        ". Very interesting.\""
    );

}


/* =========================================================
   STORY EVENT
========================================================= */

function triggerStoryEvent() {

    dialogue.style.display =
        "none";

    choices.style.display =
        "none";

    showCharacter(null);


    setTimeout(
        () => {

            dialogue.style.display =
                "block";

            speaker.textContent =
                "Narrator";

            text.textContent =
                "The classroom suddenly feels much quieter.";

        },
        500
    );


    setTimeout(
        () => {

            speaker.textContent =
                "Monika";

            text.textContent =
                "Did you notice that?";

            showCharacter(
                "monika"
            );

        },
        2800
    );


    setTimeout(
        () => {

            speaker.textContent =
                "Monika";

            text.textContent =
                "For a moment, I thought the room changed.";

        },
        5000
    );


    setTimeout(
        () => {

            beginGlitch();

        },
        7500
    );

}


/* =========================================================
   GLITCH EVENT
========================================================= */

function beginGlitch() {

    background.classList.add(
        "glitch"
    );


    document.body.style.background =
        "#000";


    showCharacter(null);


    speaker.textContent =
        "???";


    text.textContent =
        playerName +
        "...";


    setTimeout(
        () => {

            text.textContent =
                "Can you hear me?";

        },
        1300
    );


    setTimeout(
        () => {

            text.textContent =
                "Something is wrong with this room.";

        },
        2700
    );


    setTimeout(
        () => {

            background.classList.remove(
                "glitch"
            );


            showCharacter(
                "monika"
            );


            speaker.textContent =
                "Monika";


            text.textContent =
                "Don't worry.";

        },
        4200
    );


    setTimeout(
        () => {

            text.textContent =
                "I think I can fix it.";

        },
        5700
    );


    setTimeout(
        () => {

            showFinalChoice();

        },
        7200
    );

}


/* =========================================================
   FINAL CHOICE
========================================================= */

function showFinalChoice() {

    dialogue.style.display =
        "none";

    choices.style.display =
        "block";

    choices.innerHTML = "";


    const options = [

        {
            text:
                "Stay and help Monika.",

            ending:
                "stay"
        },

        {
            text:
                "Leave the classroom.",

            ending:
                "leave"
        }

    ];


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "choice";


            button.textContent =
                option.text;


            button.onclick = () => {

                choices.style.display =
                    "none";


                if (
                    option.ending ===
                    "stay"
                ) {

                    goodEnding();

                } else {

                    escapeEnding();

                }

            };


            choices.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   GOOD ENDING
========================================================= */

function goodEnding() {

    gameFinished = true;


    ending.style.display =
        "flex";


    endingTitle.textContent =
        "The Club Remains";


    endingText.textContent =
        "You stay. The strange distortion fades, " +
        "and the classroom slowly returns to normal. " +
        "Whatever happened tonight, the Literature Club " +
        "is still here — and so are you.";

}


/* =========================================================
   ESCAPE ENDING
========================================================= */

function escapeEnding() {

    gameFinished = true;


    ending.style.display =
        "flex";


    endingTitle.textContent =
        "Outside";


    endingText.textContent =
        "You leave the classroom and walk home. " +
        "The next morning, however, you find a small note " +
        "inside your school locker. It contains only one word: " +
        playerName +
        ".";

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(value) {

    return (
        value.charAt(0).toUpperCase() +
        value.slice(1)
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    const value =
        nameInput.value.trim();


    if (
        value === ""
    ) {

        nameInput.placeholder =
            "Please enter your name...";

        nameInput.focus();

        return;

    }


    playerName =
        value.substring(
            0,
            20
        );


    nameScreen.style.display =
        "none";


    sceneIndex = 0;


    setBackground(
        "corridor.jpg"
    );


    showScene();

}


/* =========================================================
   NAME BUTTON
========================================================= */

nameButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   ENTER KEY
========================================================= */

nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            startGame();

        }

    }
);


/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );


/* =========================================================
   INITIAL STATE
========================================================= */

showCharacter(null);

setBackground(
    "corridor.jpg"
);

</script>

</body>

</html>
