<style>

@keyframes lc-glitch-animation {

    0% {

        filter: none;
    }

    }

<script>

/* =====================================================
   EMBEDDED GAME
===================================================== */

(function() {

"use strict";


/* =====================================================
   STATE
===================================================== */

let playerName = "";

let sceneIndex = 0;

let poemWords = [];

let gameFinished = false;

let glitchStarted = false;


const affection = {

    sayori: 0,

    natsuki: 0,

    yuri: 0,

    monika: 0

};


/* =====================================================
   ELEMENTS
===================================================== */

const root =
    document.getElementById(
        "lc-game"
    );


const nameScreen =
    document.getElementById(
        "lc-name-screen"
    );


const nameInput =
    document.getElementById(
        "lc-name-input"
    );


const startButton =
    document.getElementById(
        "lc-start-button"
    );


const background =
    document.getElementById(
        "lc-background"
    );


const dialogue =
    document.getElementById(
        "lc-dialogue"
    );


const speaker =
    document.getElementById(
        "lc-speaker"
    );


const text =
    document.getElementById(
        "lc-text"
    );


const choices =
    document.getElementById(
        "lc-choices"
    );


const poetry =
    document.getElementById(
        "lc-poetry"
    );


const poemResult =
    document.getElementById(
        "lc-poem-result"
    );


const finishPoem =
    document.getElementById(
        "lc-finish-poem"
    );


const ending =
    document.getElementById(
        "lc-ending"
    );


const endingTitle =
    document.getElementById(
        "lc-ending-title"
    );


const endingText =
    document.getElementById(
        "lc-ending-text"
    );


const characters = {

    sayori:
        document.getElementById(
            "lc-sayori"
        ),

    natsuki:
        document.getElementById(
            "lc-natsuki"
        ),

    yuri:
        document.getElementById(
            "lc-yuri"
        ),

    monika:
        document.getElementById(
            "lc-monika"
        )

};


/* =====================================================
   BACKGROUND
===================================================== */

function setBackground(
    image
) {

    background.style.backgroundImage =
        'url("' +
        image +
        '")';

}


/* =====================================================
   CHARACTERS
===================================================== */

function showCharacter(
    character
) {

    Object
        .values(characters)
        .forEach(
            element => {

                element.classList.add(
                    "hidden"
                );

            }
        );


    if (
        character &&
        characters[character]
    ) {

        characters[character]
            .classList
            .remove(
                "hidden"
            );

    }

}


/* =====================================================
   TEXT
===================================================== */

function processText(
    value
) {

    return value.replace(
        /\{\{name\}\}/g,
        playerName
    );

}


/* =====================================================
   STORY
===================================================== */

const scenes = [

    {
        speaker:
            "Narrator",

        character:
            null,

        background:
            "corridor.jpg",

        text:
            "The final bell rings. You walk through the quiet school corridor when you notice a handwritten sign taped to a classroom door."
    },


    {
        speaker:
            "Narrator",

        character:
            null,

        background:
            "corridor.jpg",

        text:
            "LITERATURE CLUB — NEW MEMBERS WELCOME."
    },


    {
        speaker:
            "Sayori",

        character:
            "sayori",

        background:
            "Club.jpeg",

        text:
            "There you are! I was starting to wonder if you'd actually come, {{name}}!"
    },


    {
        speaker:
            "Sayori",

        character:
            "sayori",

        background:
            "Club.jpeg",

        text:
            "Come on! Everyone's waiting inside."
    },


    {
        speaker:
            "Narrator",

        character:
            null,

        background:
            "Club.jpeg",

        text:
            "You step into the Literature Club."
    },


    {
        speaker:
            "Natsuki",

        character:
            "natsuki",

        background:
            "Club.jpeg",

        text:
            "Hmph. So you're the new member."
    },


    {
        speaker:
            "Natsuki",

        character:
            "natsuki",

        background:
            "Club.jpeg",

        text:
            "Don't expect me to make some huge welcome speech."
    },


    {
        speaker:
            "Yuri",

        character:
            "yuri",

        background:
            "Club.jpeg",

        text:
            "Natsuki... you could at least try to be welcoming."
    },


    {
        speaker:
            "Yuri",

        character:
            "yuri",

        background:
            "Club.jpeg",

        text:
            "It's nice to meet you, {{name}}."
    },


    {
        speaker:
            "Monika",

        character:
            "monika",

        background:
            "Club.jpeg",

        text:
            "And I'm Monika, the club president."
    },


    {
        speaker:
            "Monika",

        character:
            "monika",

        background:
            "Club.jpeg",

        text:
            "I'm glad you decided to give us a chance."
    },


    {
        speaker:
            "Sayori",

        character:
            "sayori",

        background:
            "Club.jpeg",

        text:
            "Today we're going to do something really simple."
    },


    {
        speaker:
            "Sayori",

        character:
            "sayori",

        background:
            "Club.jpeg",

        text:
            "We're all going to write a poem!"
    },


    {
        speaker:
            "Natsuki",

        character:
            "natsuki",

        background:
            "Club.jpeg",

        text:
            "Finally. Something fun."
    },


    {
        speaker:
            "Yuri",

        character:
            "yuri",

        background:
            "Club.jpeg",

        text:
            "I think writing can reveal quite a lot about someone."
    },


    {
        speaker:
            "Monika",

        character:
            "monika",

        background:
            "Club.jpeg",

        text:
            "Exactly."
    },


    {
        speaker:
            "Monika",

        character:
            "monika",

        background:
            "Club.jpeg",

        text:
            "So, {{name}}, whose advice would you like first?"
    }

];


/* =====================================================
   SHOW SCENE
===================================================== */

function showScene() {

    if (
        sceneIndex >=
        scenes.length
    ) {

        showMainChoice();

        return;

    }


    const scene =
        scenes[
            sceneIndex
        ];


    setBackground(
        scene.background
    );


    showCharacter(
        scene.character
    );


    speaker.textContent =
        scene.speaker;


    text.textContent =
        processText(
            scene.text
        );

}


/* =====================================================
   DIALOGUE CLICK
===================================================== */

dialogue.addEventListener(
    "click",
    function() {

        if (
            gameFinished
        ) {
            return;
        }


        sceneIndex++;

        showScene();

    }
);


/* =====================================================
   CHARACTER CHOICE
===================================================== */

function showMainChoice() {

    dialogue.style.display =
        "none";


    choices.style.display =
        "block";


    choices.innerHTML = "";


    const options = [

        {
            name:
                "Sayori",

            key:
                "sayori"
        },

        {
            name:
                "Natsuki",

            key:
                "natsuki"
        },

        {
            name:
                "Yuri",

            key:
                "yuri"
        },

        {
            name:
                "Monika",

            key:
                "monika"
        }

    ];


    options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "lc-choice";


            button.textContent =
                "Ask " +
                option.name +
                " for advice.";


            button.addEventListener(
                "click",
                function() {

                    affection[
                        option.key
                    ]++;


                    choices.style.display =
                        "none";


                    openPoetry();

                }
            );


            choices.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   POETRY
===================================================== */

function openPoetry() {

    poemWords = [];


    poemResult.textContent =
        "Your poem is empty...";


    finishPoem.style.display =
        "none";


    poetry.style.display =
        "block";

}


/* =====================================================
   WORDS
===================================================== */

root
    .querySelectorAll(
        ".lc-word"
    )
    .forEach(
        word => {

            word.addEventListener(
                "click",
                function() {

                    if (
                        poemWords.length >=
                        10
                    ) {
                        return;
                    }


                    poemWords.push(
                        word.textContent
                    );


                    poemResult.textContent =
                        poemWords.join(
                            " • "
                        );


                    if (
                        poemWords.length >=
                        5
                    ) {

                        finishPoem.style.display =
                            "inline-block";

                    }

                }
            );

        }
    );


/* =====================================================
   POEM CHARACTER
===================================================== */

function determinePoemCharacter() {

    const words =
        poemWords
            .join(" ")
            .toLowerCase();


    const scores = {

        sayori:
            affection.sayori,

        natsuki:
            affection.natsuki,

        yuri:
            affection.yuri,

        monika:
            affection.monika

    };


    if (
        words.includes(
            "sunshine"
        ) ||
        words.includes(
            "smile"
        ) ||
        words.includes(
            "friend"
        ) ||
        words.includes(
            "hope"
        )
    ) {

        scores.sayori += 2;

    }


    if (
        words.includes(
            "heart"
        ) ||
        words.includes(
            "warmth"
        )
    ) {

        scores.natsuki += 2;

    }


    if (
        words.includes(
            "night"
        ) ||
        words.includes(
            "silence"
        ) ||
        words.includes(
            "ocean"
        ) ||
        words.includes(
            "lonely"
        )
    ) {

        scores.yuri += 2;

    }


    if (
        words.includes(
            "secret"
        ) ||
        words.includes(
            "forever"
        ) ||
        words.includes(
            "dream"
        )
    ) {

        scores.monika += 2;

    }


    let winner =
        "sayori";


    Object.keys(
        scores
    ).forEach(
        key => {

            if (
                scores[key] >
                scores[winner]
            ) {

                winner =
                    key;

            }

        }
    );


    return winner;

}


/* =====================================================
   POEM REACTION
===================================================== */

function poemReaction(
    character
) {

    if (
        character ===
        "sayori"
    ) {

        return (
            "Sayori reads your poem carefully. " +
            "\"It's really sweet, " +
            playerName +
            ". I think I understand what you were trying to say.\""
        );

    }


    if (
        character ===
        "natsuki"
    ) {

        return (
            "Natsuki looks over your poem. " +
            "\"Not bad. Don't let that go to your head, though.\""
        );

    }


    if (
        character ===
        "yuri"
    ) {

        return (
            "Yuri studies the page quietly. " +
            "\"There is something strangely personal about this...\""
        );

    }


    return (
        "Monika smiles as she reads your poem. " +
        "\"Interesting choices, " +
        playerName +
        ". Very interesting.\""
    );

}


/* =====================================================
   FINISH POEM
===================================================== */

finishPoem.addEventListener(
    "click",
    function() {

        poetry.style.display =
            "none";


        dialogue.style.display =
            "block";


        const character =
            determinePoemCharacter();


        showCharacter(
            character
        );


        speaker.textContent =
            character.charAt(0)
                .toUpperCase() +
            character.slice(1);


        text.textContent =
            poemReaction(
                character
            );


        setTimeout(
            function() {

                dialogue.onclick =
                    function() {

                        dialogue.onclick =
                            null;

                        beginGlitch();

                    };

            },
            100
        );

    }
);


/* =====================================================
   GLITCH
===================================================== */

function beginGlitch() {

    if (
        glitchStarted
    ) {
        return;
    }


    glitchStarted = true;


    background.classList.add(
        "lc-glitch"
    );


    speaker.textContent =
        "???" ;


    text.textContent =
        playerName +
        "...";


    showCharacter(
        null
    );


    setTimeout(
        function() {

            text.textContent =
                "Can you hear me?";

        },
        1200
    );


    setTimeout(
        function() {

            text.textContent =
                "Something is wrong with this room.";

        },
        2600
    );


    setTimeout(
        function() {

            background.classList.remove(
                "lc-glitch"
            );


            setBackground(
                "Club.jpeg"
            );


            showCharacter(
                "monika"
            );


            speaker.textContent =
                "Monika";


            text.textContent =
                "Don't worry.";

        },
        4200
    );


    setTimeout(
        function() {

            text.textContent =
                "I think I can fix it.";

        },
        5600
    );


    setTimeout(
        function() {

            showFinalChoice();

        },
        7000
    );

}


/* =====================================================
   FINAL CHOICE
===================================================== */

function showFinalChoice() {

    dialogue.style.display =
        "none";


    choices.style.display =
        "block";


    choices.innerHTML = "";


    const stay =
        document.createElement(
            "button"
        );


    stay.className =
        "lc-choice";


    stay.textContent =
        "Stay and help Monika.";


    stay.onclick =
        function() {

            choices.style.display =
                "none";


            goodEnding();

        };


    choices.appendChild(
        stay
    );


    const leave =
        document.createElement(
            "button"
        );


    leave.className =
        "lc-choice";


    leave.textContent =
        "Leave the classroom.";


    leave.onclick =
        function() {

            choices.style.display =
                "none";


            escapeEnding();

        };


    choices.appendChild(
        leave
    );

}


/* =====================================================
   ENDINGS
===================================================== */

function goodEnding() {

    gameFinished = true;


    ending.style.display =
        "flex";


    endingTitle.textContent =
        "The Club Remains";


    endingText.textContent =
        "You stay. The strange distortion fades, " +
        "and the classroom slowly returns to normal. " +
        "Whatever happened tonight, the Literature Club " +
        "is still here — and so are you.";

}


function escapeEnding() {

    gameFinished = true;


    ending.style.display =
        "flex";


    endingTitle.textContent =
        "Outside";


    endingText.textContent =
        "You leave the classroom and walk home. " +
        "The next morning, however, you find a small note " +
        "inside your school locker. It contains only one word: " +
        playerName +
        ".";

}


/* =====================================================
   START
===================================================== */

function startGame() {

    const name =
        nameInput.value.trim();


    if (
        name.length === 0
    ) {

        nameInput.value = "";

        nameInput.placeholder =
            "Please enter your name...";

        nameInput.focus();

        return;

    }


    playerName =
        name.substring(
            0,
            20
        );


    nameScreen.style.display =
        "none";


    sceneIndex = 0;

    gameFinished = false;

    glitchStarted = false;


    setBackground(
        "corridor.jpg"
    );


    showScene();

}


/* =====================================================
   BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);


/* =====================================================
   ENTER KEY
===================================================== */

nameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            startGame();

        }

    }
);


/* =====================================================
   RESTART
===================================================== */

document
    .getElementById(
        "lc-restart"
    )
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/* =====================================================
   INITIALIZATION
===================================================== */

setBackground(
    "corridor.jpg"
);


showCharacter(
    null
);

})();

</script>
